name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'data-models/**'
      - 'docs/**'
      - 'tools/build_manifest.py'
      - 'tools/sync_viewer.py'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The viewer is authored once in docs/ and copied into the Databricks App.
  # This job is the enforcement that keeps the copy honest; it must run even
  # when the deploy is skipped, so it is a separate job with no dependency.
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            docs
            tools
            model-viewer/model-viewer-app/public
          sparse-checkout-cone-mode: false
      - name: docs/index.html and the Databricks App copy must be identical
        run: python3 tools/sync_viewer.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      # The model.json blobs are 866 MB, so the checkout is blobless and sparse.
      # build_manifest.py reads byte sizes from `git ls-tree -l` (trees only) and
      # v1 counts from models-info.csv, so 80 of the 108 models cost no bytes.
      # The 28 v2 models have no CSV row, so it reads them with `git cat-file`,
      # which the partial clone lazily fetches: 261 MB instead of 866 MB.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            docs
            tools
            README.md
            data-models/models-info.csv
          sparse-checkout-cone-mode: false

      - name: Build manifest
        run: |
          python3 tools/build_manifest.py \
            --repo . \
            --ref "$GITHUB_SHA" \
            --source "$GITHUB_REPOSITORY" \
            --strict \
            --out docs/manifest.json
          python3 -m json.tool docs/manifest.json > /dev/null

      - name: Assert manifest shape
        run: python3 tools/build_manifest.py --check docs/manifest.json

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp docs/index.html docs/manifest.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [build, drift-guard]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
