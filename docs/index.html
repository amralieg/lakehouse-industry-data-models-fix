    /* the neutrals carry a slight blue cast everywhere else, which is right for

    --line:#e6e6e6; --line-strong:#d4d4d4;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;width:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--well)}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--sep)}
  input,select,button{font-family:inherit;color:var(--ink)}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fade-in{animation:fadeIn .2s ease-in}

  .btn{padding:7px 11px;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;cursor:pointer;font-size:12px;font-weight:650;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--well);border-color:var(--line-strong)}
  .btn:active{background:var(--line)}
  .btn-accent{background:var(--brand);border-color:var(--brand);color:var(--on-accent)}
  .btn-accent:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
  .btn-danger:hover{filter:brightness(1.08)}

  .spinner{width:40px;height:40px;border:4px solid var(--line);border-top:4px solid var(--brand);
    border-radius:50%;animation:spin .8s linear infinite}

  select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:6px 8px;font-size:12px;outline:none;cursor:pointer}
  select:focus{border-color:var(--brand)}
  input[type=text]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:12px;outline:none;width:100%}
  input[type=text]:focus{border-color:var(--brand)}
  input[type=text]::placeholder{color:var(--faint)}
  input[type=range]{accent-color:var(--brand);width:100%;cursor:pointer}
  input[type=checkbox]{accent-color:var(--brand);cursor:pointer}

  .tag-pill{display:inline-block;padding:2px 8px;background:var(--g-violet-tile);color:var(--g-violet-ink);
    border:1px solid var(--g-violet-bd);border-radius:20px;font-size:9px;font-weight:650;margin:0 5px 5px 0}
  .attr-row{padding:7px 0;border-bottom:1px solid var(--line)}
  .domain-box{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:5px}
  .tooltip{position:absolute;background:var(--card);color:var(--ink);font-size:11px;padding:6px 10px;
    border-radius:8px;border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);
    pointer-events:none;white-space:normal;z-index:5000;max-width:300px}
  .tree-item{user-select:none;border-radius:6px}
  .tree-item:hover{background:var(--veil)}
  .subdomain-label{font-size:11px;color:var(--muted);font-weight:650}
  .section-header{font-size:11px;color:var(--muted);margin:10px 0 8px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em}

  /* ── gallery chrome ─────────────────────────────────────────── */
  .topbar{display:flex;flex-direction:column;flex-shrink:0;background:var(--panel);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow-seam)}
  .topbar-row{display:flex;align-items:center;gap:8px;padding:7px 14px;flex-wrap:wrap}
  .topbar-row+.topbar-row{border-top:1px solid var(--line)}
  .brandmark{display:flex;align-items:center;gap:8px;margin-right:6px;white-space:nowrap}
  .brandmark-dot{width:10px;height:10px;border-radius:3px;background:var(--brand);flex-shrink:0}
  .brandmark-title{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}

  .sectab{padding:6px 11px;border:1px solid transparent;border-radius:10px;background:transparent;
    color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s}
  .sectab:hover{background:var(--veil);color:var(--ink)}
  .sectab.on{background:var(--card);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow)}
  .sectab-n{margin-left:6px;font-size:10px;font-weight:700;color:var(--faint)}
  .sectab.on .sectab-n{color:var(--brand)}

  .chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s}
  .chip:hover{border-color:var(--brand-bd);background:var(--brand-wash)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-accent)}
  .chip.on:hover{background:var(--brand-ink)}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
  .seg button{padding:5px 11px;border:0;background:transparent;color:var(--muted);font-size:11px;
    font-weight:700;cursor:pointer;letter-spacing:.04em}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{background:var(--veil);color:var(--ink)}
  .seg button.on{background:var(--brand);color:var(--on-accent)}

  .stat{display:inline-flex;align-items:baseline;gap:4px;font-size:11px;white-space:nowrap}
  .stat b{font-size:12px;font-weight:800;color:var(--ink)}
  .stat span{color:var(--muted)}

  .iconbtn{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;
    padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    cursor:pointer;font-size:13px}
  .iconbtn:hover{background:var(--well);border-color:var(--line-strong)}

  .menu{position:absolute;top:calc(100% + 6px);right:0;z-index:4000;min-width:168px;padding:6px;
    background:var(--card);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow-lg)}
  .menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;
    background:transparent;color:var(--ink);font-size:12px;font-weight:650;text-align:left;
    border-radius:7px;cursor:pointer}
  .menu button:hover{background:var(--veil)}
  .menu button.on{color:var(--brand)}
  .swatch{display:inline-flex;gap:2px;flex-shrink:0}

<div id="root"></div>
<script>
/* ─────────────────────────────────────────────────────────
   MODEL VIEWER - React + Cytoscape.js
   ─────────────────────────────────────────────────────── */
const {useState,useEffect,useRef,useCallback,useMemo,memo} = React;
const h = React.createElement;

// ── Constants ─────────────────────────────────────────────
const HUE_GROUPS = ['green','teal','blue','slate','violet','plum','rose','coral','amber'];
const DOMAIN_SLOTS = [
  '--g-green-line', '--g-teal-line', '--g-blue-line', '--g-slate-line', '--g-violet-line', '--g-plum-line', '--g-rose-line', '--g-coral-line', '--g-amber-line',
  '--g-green-ink', '--g-teal-ink', '--g-blue-ink', '--g-slate-ink', '--g-violet-ink', '--g-plum-ink', '--g-rose-ink', '--g-coral-ink', '--g-amber-ink',
];
const SUBDOMAIN_SLOTS = [
  '--g-green-head', '--g-teal-head', '--g-blue-head', '--g-slate-head', '--g-violet-head', '--g-plum-head', '--g-rose-head', '--g-coral-head', '--g-amber-head',
  '--g-green-line', '--g-teal-line', '--g-blue-line', '--g-slate-line', '--g-violet-line', '--g-plum-line', '--g-rose-line', '--g-coral-line', '--g-amber-line',
  '--g-green-ink', '--g-teal-ink', '--g-blue-ink', '--g-slate-ink', '--g-violet-ink', '--g-plum-ink', '--g-rose-ink', '--g-coral-ink', '--g-amber-ink',
];
const DEFAULT_W = 500, DEFAULT_H = 400;
const TREE_ATTR_CAP = 250;

// ── Theme ─────────────────────────────────────────────────
const THEME_KEY='dbx-model-theme', PAL_KEY='dbx-model-pal';
const PALETTES=[
  {id:'default',label:'Default'},{id:'muted',label:'Muted'},{id:'vivid',label:'Vivid'},
  {id:'ocean',label:'Ocean'},{id:'sunset',label:'Sunset'},{id:'mono',label:'Mono'},
  {id:'solid',label:'Solid'},{id:'pop',label:'Pop'},{id:'neon',label:'Neon'},
  {id:'earth',label:'Earth'},{id:'jewel',label:'Jewel'},{id:'nordic',label:'Nordic'},
  {id:'berry',label:'Berry'},
];
const store={
  get(k,fb){try{return localStorage.getItem(k)||fb;}catch(e){return fb;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
};
function currentTheme(){return document.body.classList.contains('theme-dark')?'dark':'light';}
function currentPalette(){
  const m=(document.body.className||'').match(/\bpal-([a-z]+)\b/);
  return m?m[1]:'default';
}
function applyTheme(theme){
  document.body.classList.toggle('theme-dark',theme==='dark');
  store.set(THEME_KEY,theme);
}
function applyPalette(pal){
  PALETTES.forEach(p=>document.body.classList.remove('pal-'+p.id));
  if(pal&&pal!=='default') document.body.classList.add('pal-'+pal);
  store.set(PAL_KEY,pal||'default');
}

// ── Graph data extraction ──────────────────────────────────
function extractGraph(dataModel) {
  const nodes = [], edges = [];
  const domainColors = {}, domainStats = {}, domainHierarchy = {}, domainSlots = {};
  let totalAttrs = 0, totalTags = 0;

  const domains = dataModel.domains || [];
  domains.forEach((domain, idx) => {
    const dname = domain.name || `domain_${idx}`;
    const slot = DOMAIN_SLOTS[idx % DOMAIN_SLOTS.length];
    const color = 'var('+slot+')';
    domainColors[dname] = color;
    domainSlots[dname] = slot;

    let dAttr=0, dFk=0, dTag=0, dTbl=0;
    const dCatCount={};
    domainHierarchy[dname] = {
      color, slot, description: domain.description||'', division: domain.division||'',
      tables:{}, subdomains:{}
    };

    (domain.products||[]).forEach(product => {
      const tname = product.name||'';
      const fullId = `${dname}.${tname}`;
      const subdomain = product.subdomain||'';
      // original physical table name (for the "semantic" toggle): prefer the source
      // reference (catalog.schema.table) leaf, then table_name, then the product name.
      const origName = ((product.reference||'').split('.').pop())||product.table_name||tname;
      // physical catalog/schema from the source reference (catalog.schema.table),
      // used by the Semantic toggle to relabel domain->catalog, subdomain->database.
      const refParts=(product.reference||'').split('.');
      const pCatalog=refParts.length>=3?refParts[0]:'';
      const pSchema=refParts.length>=3?refParts[refParts.length-2]:'';
      if(pCatalog) dCatCount[pCatalog]=(dCatCount[pCatalog]||0)+1;
      dTbl++;

      const attrs = product.attributes||[];
      const attrList = attrs.map(a => {
        // Handle tags as string or array; detect primary_key
        const tagsVal = a.tags;
        const isPk = a.primary_key===true || a.primary_key==='true'
          || (typeof tagsVal==='string' && tagsVal.toLowerCase().includes('primary_key'))
          || (Array.isArray(tagsVal) && tagsVal.some(t=>t.toLowerCase().includes('primary_key')));
        const fk = (a.foreign_key_to||'').trim();
        return {
          name: a.name||'', type: a.type||'', fk, pk: isPk,
          desc: a.description||a.desc||'', tags: Array.isArray(tagsVal)?tagsVal: tagsVal?[tagsVal]:[]
        };
      });

      const fkCount = attrList.filter(a=>a.fk).length;
      const tagArr = Array.isArray(product.tags)?product.tags: product.tags?[product.tags]:[];
      dAttr+=attrList.length; dFk+=fkCount; dTag+=tagArr.length;
      totalAttrs+=attrList.length; totalTags+=tagArr.length;

      const tableEntry = {
        full_id:fullId, description:product.description||'', tags:tagArr,
        attributes:attrList, attribute_count:attrList.length, fk_count:fkCount, subdomain
      };
      domainHierarchy[dname].tables[tname] = tableEntry;

      if(subdomain){
        if(!domainHierarchy[dname].subdomains[subdomain])
          domainHierarchy[dname].subdomains[subdomain]={tables:[],attr_count:0,fk_count:0,schemaCount:{}};
        const sd=domainHierarchy[dname].subdomains[subdomain];
        sd.tables.push(tname); sd.attr_count+=attrList.length; sd.fk_count+=fkCount;
        if(pSchema) sd.schemaCount[pSchema]=(sd.schemaCount[pSchema]||0)+1;
      }

      nodes.push({
        data:{id:fullId,label:tname,sem_label:tname,orig_label:origName,
              orig_catalog:pCatalog,orig_schema:pSchema,
              parent:`domain_${dname}`,type:'table',
              domain:dname,subdomain,attribute_count:attrList.length,
              fk_count:fkCount,tag_count:tagArr.length,color,slot},
        classes:'table-node'
      });

      attrList.forEach(attr=>{
        if(!attr.fk) return;
        const parts=attr.fk.split('.');
        if(parts.length<2) return;
        const targetId=`${parts[0]}.${parts[1]}`;
        const targetCol=parts[2]||`${parts[1]}_id`;
        // agent-synthesised FKs carry a `_dbx_fk_*` tag (declared UC FKs do not).
        const isDbxFk=(attr.tags||[]).some(t=>/(^|_)dbx_fk/i.test(String(t)));
        edges.push({
          data:{
            id:`edge_${fullId}_${targetId}_${attr.name}`,
            source:fullId,target:targetId,label:attr.name,
            source_domain:dname,target_domain:parts[0],
            source_column:attr.name,target_column:targetCol,
            source_table:tname,target_table:parts[1],fk_full:attr.fk,
            dbx_fk:isDbxFk
          },
          classes:isDbxFk?'fk-edge dbx-fk-edge':'fk-edge'
        });
      });
    });

    domainStats[dname]={table_count:dTbl,attr_count:dAttr,fk_count:dFk,tag_count:dTag};
    const domCatalog=Object.keys(dCatCount).sort((a,b)=>dCatCount[b]-dCatCount[a])[0]||'';
    domainHierarchy[dname].catalog=domCatalog;
    nodes.push({
      data:{id:`domain_${dname}`,label:dname.toUpperCase(),
            sem_label:dname.toUpperCase(),orig_label:domCatalog||dname.toUpperCase(),
            orig_catalog:domCatalog,type:'domain',color,slot,
            division:domain.division||'',table_count:dTbl,attr_count:dAttr,
            fk_count:dFk,tag_count:dTag,width:DEFAULT_W,height:DEFAULT_H},
      classes:'domain-node'
    });
  });

  return {nodes,edges,domainColors,domainStats,domainHierarchy,domainSlots,
          totalAttrs,totalTags,
          modelName:dataModel.name||'Data Model',
          modelVersion:dataModel.version||''};
}

// ── Precompute indexes ─────────────────────────────────────
function buildIndexes(graphData){
  const {nodes,edges}=graphData;
  const tableById={}, domainByName={}, tablesByDomain={};
  const edgesBySource={}, edgesByTarget={}, edgesWithinDomain={};
  nodes.forEach(n=>{
    if(n.classes==='table-node'){
      tableById[n.data.id]=n;
      const d=n.data.domain;
      if(d){(tablesByDomain[d]=tablesByDomain[d]||[]).push(n);}
    } else if(n.classes==='domain-node'){
      const k=n.data.id.replace('domain_','');
      domainByName[k]=n;
    }
  });
  edges.forEach(e=>{
    const s=e.data.source,t=e.data.target;
    (edgesBySource[s]=edgesBySource[s]||[]).push(e);
    (edgesByTarget[t]=edgesByTarget[t]||[]).push(e);
    const sd=s.split('.')[0],td=t.split('.')[0];
    if(sd&&sd===td)(edgesWithinDomain[sd]=edgesWithinDomain[sd]||[]).push(e);
  });
  return {tableById,domainByName,tablesByDomain,edgesBySource,edgesByTarget,edgesWithinDomain};
}

// ── Clustered layout positions ─────────────────────────────
function calcClusteredPositions(nodes, tableArrangement, domainSizes){
  domainSizes=domainSizes||{};
  const domainTables={};
  nodes.forEach(n=>{if(n.classes==='table-node'){const d=n.data.domain||'unknown';(domainTables[d]=domainTables[d]||[]).push(n);}});
  const domainNames=Object.keys(domainTables).sort();
  const numDomains=domainNames.length;
  if(!numDomains) return {};

  // Compute each domain's actual box size
  const boxSizes={};
  domainNames.forEach(dname=>{
    const sz=domainSizes[`domain_${dname}`]||{};
    const tblCount=(domainTables[dname]||[]).length;
    const autoW=Math.max(DEFAULT_W, Math.ceil(Math.sqrt(tblCount))*120);
    const autoH=Math.max(DEFAULT_H, Math.ceil(Math.sqrt(tblCount))*100);
    boxSizes[dname]={w:sz.width||autoW, h:sz.height||autoH};
  });

  // Outer ring: large enough that boxes don't overlap
  const gap=80;
  const circumference=domainNames.reduce((sum,d)=>{
    const diag=Math.sqrt(boxSizes[d].w**2+boxSizes[d].h**2);
    return sum+diag+gap;
  },0);
  let outerR=Math.max(800, circumference/(2*Math.PI));

  const domainCenters={};
  if(numDomains===1){
    domainCenters[domainNames[0]]=[0,0];
  } else {
    domainNames.forEach((dname,i)=>{
      const angle=(2*Math.PI*i/numDomains)-(Math.PI/2);
      domainCenters[dname]=[outerR*Math.cos(angle), outerR*Math.sin(angle)];
    });
  }

  const positions={};
  domainNames.forEach(dname=>{
    const tables=domainTables[dname]||[];
    const [cx,cy]=domainCenters[dname];
    const bw=boxSizes[dname].w, bh=boxSizes[dname].h;
    const pad=40;

    if(tableArrangement==='circle'){
      // Circular arrangement inside the box
      const r=Math.min(bw,bh)/2-pad;
      if(tables.length===1){
        positions[tables[0].data.id]={x:cx,y:cy};
      } else {
        tables.forEach((n,i)=>{
          const a=(2*Math.PI*i/tables.length)-(Math.PI/2);
          positions[n.data.id]={x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};
        });
      }
    } else {
      // Grid arrangement inside the box
      const usableW=bw-pad*2, usableH=bh-pad*2;
      const cols=Math.max(1,Math.ceil(Math.sqrt(tables.length)));
      const rows=Math.ceil(tables.length/cols);
      const cellW=usableW/cols, cellH=usableH/rows;
      tables.forEach((n,i)=>{
        const col=i%cols, row=Math.floor(i/cols);
        positions[n.data.id]={
          x: cx-usableW/2+cellW/2+col*cellW,
          y: cy-usableH/2+cellH/2+row*cellH
        };
      });
    }
    positions[`domain_${dname}`]={x:cx,y:cy};
  });
  return positions;
}

// ── Domain view positions ──────────────────────────────────
function calcDomainViewPositions(filteredNodes){
  const groups={};
  filteredNodes.forEach(n=>{
    if(n.classes==='table-node'||n.classes==='table-node domain-view-node'){
      const p=n.data.parent||'__ungrouped__';
      (groups[p]=groups[p]||[]).push(n);
    }
  });
  if(!Object.keys(groups).length) return {};
  const sorted=Object.entries(groups).sort((a,b)=>a[0]==='__ungrouped__'?1:b[0]==='__ungrouped__'?-1:a[0].localeCompare(b[0]));
  const ns=130; // spacing between nodes inside a group
  const pad=160; // extra padding around each group for subdomain box + label

  // Calculate each group's bounding size including padding
  const groupSizes=sorted.map(([,tables])=>{
    const cols=Math.max(1,Math.ceil(Math.sqrt(tables.length)));
    const rows=Math.ceil(tables.length/cols);
    return {w:cols*ns+pad, h:rows*ns+pad, cols, rows};
  });

  const numGroups=sorted.length;
  if(numGroups===1){
    const tables=sorted[0][1];
    const {cols}=groupSizes[0];
    const positions={};
    tables.forEach((n,i)=>{
      const row=Math.floor(i/cols),col=i%cols;
      positions[n.data.id]={x:(col-(cols-1)/2)*ns, y:(row-(Math.ceil(tables.length/cols)-1)/2)*ns};
    });
    return positions;
  }

  // Grid layout: pack subdomain boxes into rows/cols using max width/height per column/row
  const gap=100;
  const gCols=Math.ceil(Math.sqrt(numGroups));
  const gRows=Math.ceil(numGroups/gCols);
  const colWidths=new Array(gCols).fill(0);
  const rowHeights=new Array(gRows).fill(0);
  groupSizes.forEach((g,gi)=>{
    const gc=gi%gCols, gr=Math.floor(gi/gCols);
    colWidths[gc]=Math.max(colWidths[gc],g.w);
    rowHeights[gr]=Math.max(rowHeights[gr],g.h);
  });
  const totalW=colWidths.reduce((s,w)=>s+w,0)+(gCols-1)*gap;
  const totalH=rowHeights.reduce((s,h)=>s+h,0)+(gRows-1)*gap;
  const colCenters=colWidths.map((w,i)=>{
    let x=-totalW/2;
    for(let k=0;k<i;k++) x+=colWidths[k]+gap;
    return x+w/2;
  });
  const rowCenters=rowHeights.map((h,i)=>{
    let y=-totalH/2;
    for(let k=0;k<i;k++) y+=rowHeights[k]+gap;
    return y+h/2;
  });

  const positions={};
  sorted.forEach(([,tables],gi)=>{
    const gc=gi%gCols, gr=Math.floor(gi/gCols);
    const cx=colCenters[gc], cy=rowCenters[gr];
    const {cols,rows}=groupSizes[gi];
    tables.forEach((n,i)=>{
      const row=Math.floor(i/cols),col=i%cols;
      positions[n.data.id]={x:cx+(col-(cols-1)/2)*ns, y:cy+(row-(rows-1)/2)*ns};
    });
  });
  return positions;
}

// ── Cytoscape stylesheet ──────────────────────────────────
/* Cytoscape parses its stylesheet itself and never resolves a CSS custom
   property, so every colour the canvas uses has to be read out of the document
   as a literal first and re-read whenever the theme or palette changes. */
const THEME_SLOTS={ink:'--ink',muted:'--muted',faint:'--faint',line:'--line',
  lineStrong:'--line-strong',bg:'--bg',card:'--card',well:'--well',panel:'--panel',
  brand:'--brand',gold:'--m-gold',flow:'--flow-neutral',
  green:'--g-green-line',rose:'--g-rose-line',danger:'--danger'};

function resolveTheme(){
  const cs=getComputedStyle(document.body);
  const read=(v,fb)=>(cs.getPropertyValue(v)||'').trim()||fb;
  const t={};
  for(const k in THEME_SLOTS) t[k]=read(THEME_SLOTS[k],'#888888');
  t.domainRing=DOMAIN_SLOTS.map(v=>read(v,'#888888'));
  t.subdomainRing=SUBDOMAIN_SLOTS.map(v=>read(v,'#888888'));
  t.slot=(name)=>name?read(name,t.muted):t.muted;
  t.key=(document.body.className||'')+'|'+t.ink+t.card+t.domainRing.join('');
  return t;
}

/* A node keeps the NAME of its colour slot, not the colour, so a palette swap
   is a re-read rather than a re-layout. */
function paintElements(elements,t){
  return elements.map(el=>{
    const slot=el.data&&el.data.slot;
    if(!slot) return el;
    return Object.assign({},el,{data:Object.assign({},el.data,{color:t.slot(slot)})});
  });
}

function repaintGraph(cy,t){
  if(!cy) return;
  cy.batch(()=>{
    cy.nodes().forEach(n=>{
      const slot=n.data('slot');
      if(slot) n.data('color',t.slot(slot));
    });
  });
}

function getStylesheet(showDomains=true,sizeScale=1,t=null){
  t=t||resolveTheme();
  const s=sizeScale;
  const fs=(px)=>Math.round(px*s)+'px';
  const nd=(px)=>Math.round(px*s);
  const labeledNode=(w,h,bw,bc,bg='data(color)')=>[
    {selector:`node[bg="${bg}"]`,style:{}}
  ];
  const baseStyle=[
    {selector:'node',style:{
      content:'',textValign:'bottom',textHalign:'center',fontSize:'14px',fontWeight:'600',
      fontFamily:'Segoe UI,Inter,-apple-system,sans-serif',
    }},
    {selector:'.table-node',style:{
      shape:'ellipse',width:nd(22),height:nd(22),backgroundColor:'data(color)',
      borderWidth:2,borderColor:t.card,
      content:'data(label)',textValign:'bottom',textHalign:'center',
      fontSize:fs(11),fontWeight:'500',color:t.ink,textMarginY:nd(7),
      textBackgroundColor:t.card,textBackgroundOpacity:1,
      textBackgroundPadding:nd(2)+'px '+nd(5)+'px',textBackgroundShape:'roundrectangle',
    }},
    {selector:'.domain-view-node',style:{
      shape:'ellipse',width:nd(42),height:nd(42),backgroundColor:'data(color)',
      borderWidth:3,borderColor:t.card,
      content:'data(label)',textValign:'bottom',textHalign:'center',
      fontSize:fs(15),fontWeight:'700',color:t.ink,
      textOutlineWidth:0,textMarginY:nd(10),
      textBackgroundColor:t.card,textBackgroundOpacity:1,
      textBackgroundPadding:nd(4)+'px '+nd(8)+'px',textBackgroundShape:'roundrectangle',
    }},
    {selector:'.table-node:selected',style:{
      width:nd(35),height:nd(35),borderWidth:4,borderColor:t.gold,backgroundColor:t.gold,
    }},
    {selector:'.center-node',style:{
      shape:'ellipse',width:nd(28),height:nd(28),backgroundColor:'data(color)',
      borderWidth:3,borderColor:t.gold,
      content:'data(label)',textValign:'bottom',textHalign:'center',
      fontSize:fs(11),fontWeight:'600',color:t.ink,
      textOutlineWidth:0,textMarginY:nd(8),
      textBackgroundColor:t.card,textBackgroundOpacity:1,
      textBackgroundPadding:nd(3)+'px '+nd(6)+'px',textBackgroundShape:'roundrectangle',
    }},
    {selector:'.fk-source',style:{
      shape:'ellipse',width:nd(22),height:nd(22),backgroundColor:'data(color)',
      borderWidth:3,borderColor:t.green,
      content:'data(label)',textValign:'bottom',textHalign:'center',
      fontSize:fs(11),fontWeight:'600',color:t.ink,

      shape:'round-rectangle',backgroundColor:'data(color)',backgroundOpacity:0.12,

    shape:'round-rectangle',

    borderWidth:3,borderColor:'data(color)',borderOpacity:0.4,

// ── API helpers ────────────────────────────────────────────
async function apiFetch(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Tree Component ─────────────────────────────────────────
const TreeNode=memo(({domainName,domainData,expandedDomains,expandedTables,
                      onToggleDomain,onToggleTable,onClickDomain,onClickTable,onClickAttr,searchTerm})=>{
  const {color,tables={},subdomains={},division=''}=domainData;
  const isExpanded=expandedDomains.has(domainName);
  const tableEntries=useMemo(()=>Object.entries(tables).sort((a,b)=>a[0].localeCompare(b[0])),[tables]);
  const st=searchTerm.toLowerCase();
  const domainMatches=!st||domainName.toLowerCase().includes(st);
  const matchingTables=useMemo(()=>!st?tableEntries:tableEntries.filter(([tn])=>tn.toLowerCase().includes(st)),[tableEntries,st]);
  if(st&&!domainMatches&&!matchingTables.length) return null;
  const showTables=isExpanded||(st&&matchingTables.length>0);
  const visibleTables=st?matchingTables:tableEntries;
  const visibleCount=visibleTables.length;
  const divColors={'operations':'var(--g-coral-line)','business':'var(--g-blue-line)','corporate':'var(--g-amber-line)'};
  const divAbbr={'operations':'OPS','business':'BIZ','corporate':'COR'};
  const divLower=(division||'').toLowerCase();
  const hasSubs=Object.keys(subdomains).length>0;

  function renderTableRow(tname,tdata,indent){
    const fullId=tdata.full_id||`${domainName}.${tname}`;
    const attrs=tdata.attributes||[];
    const sortedAttrs=[...attrs].sort((a,b)=>a.name.localeCompare(b.name));
    const isTblExp=expandedTables.has(fullId);
    return h('div',{key:fullId,style:{marginLeft:indent,marginBottom:1}},
      h('div',{className:'tree-item',style:{display:'flex',alignItems:'center',padding:'4px 0',cursor:'pointer'}},
        h('button',{
          onClick:e=>{e.stopPropagation();onToggleTable(fullId);},
          style:{width:18,height:18,padding:0,background:'transparent',border:'1px solid var(--line)',
                 borderRadius:3,color:'var(--muted)',cursor:'pointer',fontSize:12,lineHeight:'14px',
                 marginRight:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}
        },isTblExp?'−':'+'),
        h('span',{style:{fontSize:10,marginRight:4}},'📊'),
        h('span',{
          style:{fontSize:11,color:'var(--brand)',cursor:'pointer',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},
          onClick:()=>onClickTable(fullId)
        },tname),
        h('span',{style:{fontSize:9,color:'var(--line-strong)',marginLeft:5}},'('+sortedAttrs.length+')')
      ),
      isTblExp&&h('div',{key:'attrs'},[
        ...sortedAttrs.slice(0,TREE_ATTR_CAP).map(attr=>{
        const isPk=attr.pk;
        const isFk=!!attr.fk;
        const icon=isPk?'🔑':isFk?'🔗':'•';
        const iconColor=isPk?'var(--m-gold)':isFk?'var(--danger)':'var(--line-strong)';
        const attrId=`${fullId}.${attr.name}`;
        return h('div',{key:attrId,className:'tree-item',
                        style:{display:'flex',alignItems:'center',padding:'3px 0',marginLeft:indent+24,cursor:'pointer'},
                        onClick:()=>onClickAttr(attrId)},
          h('span',{style:{fontSize:10,color:iconColor,marginRight:6,width:14,flexShrink:0}},icon),
          h('span',{style:{fontSize:10,color:'var(--ink)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},attr.name),
          h('span',{style:{fontSize:9,color:'var(--faint)',marginLeft:5}},attr.type)
        );
      }),
        sortedAttrs.length>TREE_ATTR_CAP&&h('div',{key:'__more',
          style:{fontSize:9,color:'var(--muted)',fontStyle:'italic',marginLeft:indent+24,padding:'3px 0'}},
          `… ${sortedAttrs.length-TREE_ATTR_CAP} more attributes (click the product to view all)`)
      ])
    );
  }

  return h('div',{style:{marginBottom:2}},
    h('div',{className:'tree-item'},
      h('div',{style:{display:'flex',alignItems:'center',padding:'6px 0'}},
        h('button',{
          onClick:e=>{e.stopPropagation();onToggleDomain(domainName);},
          style:{width:20,height:20,padding:0,background:'transparent',border:'1px solid var(--line-strong)',
                 borderRadius:3,color:'var(--ink)',cursor:'pointer',fontSize:14,lineHeight:'16px',
                 marginRight:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}
        },isExpanded?'−':'+'),
        h('div',{style:{width:12,height:12,background:color,borderRadius:3,marginRight:8,flexShrink:0}}),
        h('span',{
          style:{fontSize:12,color:'var(--ink)',cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1},
          onClick:()=>onClickDomain(domainName)
        },domainName.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())),
        h('span',{style:{fontSize:10,color:'var(--faint)',marginLeft:5}},'('+visibleCount+')'),
        divColors[divLower]&&h('span',{style:{
          display:'inline-block',padding:'1px 4px',background:divColors[divLower],color:'var(--ink)',
          borderRadius:3,fontSize:8,fontWeight:'bold',marginLeft:5,flexShrink:0,lineHeight:'12px'
        }},divAbbr[divLower]||divLower.slice(0,3).toUpperCase())
      )
    ),
    showTables&&h('div',{},
      hasSubs
        ? h('div',{},
            ...Object.keys(subdomains).sort().map(sdname=>{
              const sdTables=visibleTables.filter(([,d])=>(d.subdomain||'')===sdname);
              const ungrouped=visibleTables.filter(([,d])=>!(d.subdomain||''));
              return [
                h('div',{key:sdname,style:{marginLeft:28,marginBottom:1,borderBottom:'1px solid var(--veil)'}},
                  h('div',{style:{display:'flex',alignItems:'center',padding:'5px 0'}},
                    h('span',{style:{fontSize:8,color,marginRight:6}},'◆'),
                    h('span',{className:'subdomain-label',style:{flex:1}},sdname.replace(/_/g,' ').replace(/-/g,' ')),
                    h('span',{style:{fontSize:9,color:'var(--line-strong)',marginLeft:5}},'('+sdTables.length+')')
                  )
                ),
                ...sdTables.map(([tn,td])=>renderTableRow(tn,td,42)),
              ];
            }).flat(),
            ...visibleTables.filter(([,d])=>!(d.subdomain||'')).map(([tn,td])=>renderTableRow(tn,td,28))
          )
        : visibleTables.map(([tn,td])=>renderTableRow(tn,td,28))
    )
  );
});

// ── Node Info Panel ────────────────────────────────────────
function NodeInfoPanel({selectedNode,selectedEdge,treeClick,graphData,domainSizes,setDomainSizes,filterState}){
  if(!graphData) return h('div',{style:{padding:'15px'}},
    h('h3',{className:'section-header',style:{borderBottom:'1px solid var(--line)',paddingBottom:10,marginBottom:15}},'📌 Details'),
    h('p',{style:{color:'var(--muted)',fontSize:12,fontStyle:'italic'}},'Click a node to see details'),
    h('div',{style:{marginTop:20}},
      h('p',{style:{color:'var(--brand)',fontSize:11,fontWeight:'bold'}},'💡 Tips:'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:5}},'• Click node to focus'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:3}},'• Click domain to filter'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:3}},'• Double-click for FK view'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:3}},'• Click edge for details'),
    )
  );

  const {domainHierarchy={},domainColors={},domainStats={}}=graphData;

  // Edge info
  if(selectedEdge&&(!treeClick)){
    const e=selectedEdge;
    const srcDomain=domainColors[e.source_domain]||'var(--muted)';
    const tgtDomain=domainColors[e.target_domain]||'var(--muted)';
    return h('div',{style:{padding:'15px',overflowY:'auto',height:'100%'}},
      h('div',{style:{display:'flex',alignItems:'center',marginBottom:10}},
        h('span',{style:{fontSize:20,marginRight:10}},'🔗'),
        h('div',{},
          h('span',{style:{fontSize:14,fontWeight:'bold',color:'var(--ink)',display:'block'}},'Relationship'),
          h('span',{style:{fontSize:10,color:'var(--muted)'}},`${e.source_table} → ${e.target_table}`)
        )
      ),
      h('div',{className:'domain-box',style:{marginBottom:8}},
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:4}},
          h('div',{style:{width:10,height:10,background:srcDomain,borderRadius:'50%',marginRight:6}}),
          h('span',{style:{color:'var(--brand)',fontSize:11}},'Source: '),
          h('span',{style:{color:'var(--ink)',fontSize:11,marginLeft:4}},e.source_table),
        ),
        h('div',{style:{fontSize:10,color:'var(--muted)',marginLeft:16}},'Column: ',h('span',{style:{color:'var(--m-gold)'}},e.source_column))
      ),
      h('div',{className:'domain-box'},
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:4}},
          h('div',{style:{width:10,height:10,background:tgtDomain,borderRadius:'50%',marginRight:6}}),
          h('span',{style:{color:'var(--g-rose-line)',fontSize:11}},'Target: '),
          h('span',{style:{color:'var(--ink)',fontSize:11,marginLeft:4}},e.target_table),
        ),
        h('div',{style:{fontSize:10,color:'var(--muted)',marginLeft:16}},'Column: ',h('span',{style:{color:'var(--m-gold)'}},e.target_column))
      )
    );
  }

  // Determine what to show
  let nodeData=null, nodeType=null;
  if(treeClick){
    nodeType=treeClick.type;
    if(nodeType==='table'){
      const [dname,tname]=(treeClick.value||'').split('.');
      const ddata=domainHierarchy[dname]||{};
      nodeData={type:'table',id:treeClick.value,label:tname,domain:dname,
                color:ddata.color||'var(--muted)',
                ...((ddata.tables||{})[tname]||{})};
    } else if(nodeType==='domain'){
      const ddata=domainHierarchy[treeClick.value]||{};
      nodeData={type:'domain',id:`domain_${treeClick.value}`,
                label:(treeClick.value||'').toUpperCase(),
                color:ddata.color||'var(--muted)',...ddata};
    } else if(nodeType==='attribute'){
      const parts=(treeClick.value||'').split('.');
      const dname=parts[0],tname=parts[1],aname=parts.slice(2).join('.');
      const ddata=domainHierarchy[dname]||{};
      const tdata=(ddata.tables||{})[tname]||{};
      const ainfo=(tdata.attributes||[]).find(a=>a.name===aname)||{};
      nodeData={type:'attribute',id:treeClick.value,label:aname,
                domain:dname,table:tname,color:ddata.color||'var(--brand)',...ainfo};
    }
  } else if(selectedNode){
    nodeType=selectedNode.type;
    nodeData=selectedNode;
    if(nodeType==='table'){
      const [dname,tname]=(selectedNode.id||'').split('.');
      const ddata=domainHierarchy[dname]||{};
      const tdata=(ddata.tables||{})[tname]||{};
      nodeData={...selectedNode,...tdata,domain:dname,label:tname,color:selectedNode.color||ddata.color||'var(--muted)'};
    } else if(nodeType==='domain'){
      const dname=(selectedNode.id||'').replace('domain_','');
      const ddata=domainHierarchy[dname]||{};
      nodeData={...selectedNode,...ddata,color:selectedNode.color||ddata.color||'var(--muted)'};
    }
  }

  if(!nodeData) return h('div',{style:{padding:'15px'}},
    h('h3',{className:'section-header',style:{borderBottom:'1px solid var(--line)',paddingBottom:10,marginBottom:15}},'📌 Details'),
    h('p',{style:{color:'var(--muted)',fontSize:12,fontStyle:'italic'}},'Click a node or edge to see details'),
  );

  // Domain panel
  if(nodeData.type==='domain'){
    const dname=(nodeData.id||'').replace('domain_','')|| nodeData.label||'';
    const dstats=domainStats[dname]||{};
    const subs=nodeData.subdomains||{};
    const viewKey=filterState?`domain:${(filterState.value||'')}`:null;
    const curSizes=(domainSizes||{});
    const curDomSizes=curSizes[viewKey||'main']||{};
    const domId=nodeData.id||`domain_${dname}`;
    const curW=(curDomSizes[domId]||{}).width||DEFAULT_W;
    const curH=(curDomSizes[domId]||{}).height||DEFAULT_H;
    const setSize=(w,h)=>{
      const vk=viewKey||'main';
      setDomainSizes(prev=>{
        const vkSizes={...(prev[vk]||{})};
        vkSizes[domId]={width:w,height:h};
        return{...prev,[vk]:vkSizes};
      });
    };
    return h('div',{style:{padding:'15px',overflowY:'auto',height:'100%',display:'flex',flexDirection:'column'}},
      h('div',{style:{display:'flex',alignItems:'center',marginBottom:15}},
        h('div',{style:{width:20,height:20,background:nodeData.color,borderRadius:4,marginRight:10}}),
        h('span',{style:{fontSize:16,fontWeight:'bold',color:'var(--ink)'}},(dname||'').toUpperCase())
      ),
      h('div',{className:'domain-box',style:{marginBottom:10}},
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
          h('span',{style:{color:'var(--brand)',fontSize:11,marginRight:15}},'📊 '+(dstats.table_count||0)+' data products'),
          h('span',{style:{color:'var(--g-amber-line)',fontSize:11}},'📋 '+(dstats.attr_count||0)+' attrs'),
          h('br',{}),
          h('span',{style:{color:'var(--danger)',fontSize:11,marginRight:15}},'🔗 '+(dstats.fk_count||0)+' FKs'),
          h('span',{style:{color:'var(--g-violet-line)',fontSize:11}},'🏷️ '+(dstats.tag_count||0)+' tags'),
        )
      ),
      nodeData.description&&h('div',{style:{background:'var(--well)',borderRadius:6,padding:10,marginBottom:10}},
        h('p',{style:{color:'var(--ink)',fontSize:11,lineHeight:1.6,margin:0}},nodeData.description)
      ),
      Object.keys(subs).length>0&&h('div',{},
        h('div',{className:'section-header'},'Subdomains'),
        ...Object.keys(subs).sort().map(sdname=>{
          const sd=subs[sdname];
          return h('div',{key:sdname,style:{padding:10,background:'var(--well)',borderRadius:6,
                                            borderLeft:`3px solid ${nodeData.color}`,marginBottom:8}},
            h('div',{style:{display:'flex',alignItems:'center',marginBottom:4}},
              h('span',{style:{fontSize:10,color:nodeData.color,marginRight:6}},'◆'),
              h('span',{style:{fontSize:12,fontWeight:600,color:'var(--ink)',flex:1}},sdname.replace(/_/g,' ').replace(/-/g,' ')),
              h('span',{style:{fontSize:10,color:'var(--ink)',background:nodeData.color,borderRadius:10,padding:'1px 7px',fontWeight:'bold'}},''+sd.tables.length)
            ),
            h('div',{style:{fontSize:10,color:'var(--muted)',marginBottom:4}},'📋 '+sd.attr_count+' attrs  🔗 '+sd.fk_count+' FKs'),
            h('div',{style:{display:'flex',flexWrap:'wrap'}},
              sd.tables.map(t=>h('span',{key:t,style:{
                display:'inline-block',padding:'2px 7px',background:'var(--brand-wash)',
                color:'var(--brand)',borderRadius:3,fontSize:9,marginRight:4,marginBottom:4,
                border:'1px solid var(--brand-bd)'
              }},t))
            )
          );
        })
      )
    );
  }

  // Subdomain panel
  if(nodeData.type==='subdomain'){
    const sdId=nodeData.id||'';
    const parts=sdId.split('_');
    const parentDomain=parts[1]||'';
    const sdKey=parts.slice(2).join('_');
    const ddata=domainHierarchy[parentDomain]||{};
    const sdInfo=(ddata.subdomains||{})[sdKey]||{};
    return h('div',{style:{padding:'15px',overflowY:'auto',height:'100%'}},
      h('div',{style:{display:'flex',alignItems:'center',marginBottom:15}},
        h('span',{style:{fontSize:14,color:nodeData.color,marginRight:10}},'◆'),
        h('div',{},
          h('span',{style:{fontSize:16,fontWeight:'bold',color:'var(--ink)',display:'block'}},(nodeData.label||'').replace(/_/g,' ')),
          h('span',{style:{fontSize:10,color:nodeData.color}},'Subdomain of '+parentDomain.replace(/_/g,' '))
        )
      ),
      h('div',{className:'domain-box',style:{marginBottom:12}},
        h('span',{style:{color:'var(--brand)',fontSize:11,marginRight:15}},'📊 '+(sdInfo.tables||[]).length+' data products'),
        h('span',{style:{color:'var(--g-amber-line)',fontSize:11,marginRight:15}},'📋 '+(sdInfo.attr_count||0)+' attrs'),
        h('span',{style:{color:'var(--danger)',fontSize:11}},'🔗 '+(sdInfo.fk_count||0)+' FKs'),
      ),
      h('div',{className:'section-header'},'Data Products'),
      h('div',{style:{display:'flex',flexWrap:'wrap'}},
        (sdInfo.tables||[]).map(t=>h('span',{key:t,style:{
          display:'inline-block',padding:'4px 10px',background:'var(--brand-wash)',
          color:'var(--brand)',borderRadius:4,fontSize:11,marginRight:5,marginBottom:5,
          border:'1px solid var(--brand-bd)'
        }},t))
      )
    );
  }

  // Table panel
  if(nodeData.type==='table'){
    const tname=nodeData.label||(nodeData.id||'').split('.').pop()||'';
    const dname=nodeData.domain||'';
    const attrs=nodeData.attributes||[];
    const tags=Array.isArray(nodeData.tags)?nodeData.tags:nodeData.tags?[nodeData.tags]:[];
    const pkAttrs=attrs.filter(a=>a.pk);
    const fkAttrs=attrs.filter(a=>a.fk&&!a.pk);
    const otherAttrs=attrs.filter(a=>!a.pk&&!a.fk);
    const sortedAttrs=[...pkAttrs,...fkAttrs,...otherAttrs];
    return h('div',{style:{padding:'15px',display:'flex',flexDirection:'column',height:'100%'}},
      h('div',{style:{display:'flex',alignItems:'center',marginBottom:10}},
        h('div',{style:{width:20,height:20,background:nodeData.color,borderRadius:'50%',marginRight:10,border:'2px solid white'}}),
        h('div',{},
          h('span',{style:{fontSize:16,fontWeight:'bold',color:'var(--ink)',display:'block'}},tname),
          h('span',{style:{fontSize:10,color:nodeData.color}},dname.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())),
          nodeData.subdomain&&h('span',{style:{fontSize:10,color:'var(--muted)'}},' › '+nodeData.subdomain.replace(/_/g,' '))
        )
      ),
      h('div',{className:'domain-box',style:{marginBottom:10}},
        h('span',{style:{color:'var(--brand)',fontSize:11,marginRight:15}},'📊 '+(nodeData.attribute_count||attrs.length)+' attrs'),

        sortedAttrs.map(attr=>{

          return h('div',{key:attr.name,className:'attr-row'},

                attr.desc.length>100?attr.desc.slice(0,100)+'...':attr.desc)
            )
          );
        })
      )
    );
  }

  // Attribute panel
  if(nodeData.type==='attribute'){
    const color=nodeData.pk?'var(--m-gold)':nodeData.fk?'var(--danger)':(domainColors[nodeData.domain]||'var(--brand)');
    return h('div',{style:{padding:'15px',overflowY:'auto',height:'100%'}},
      h('div',{style:{display:'flex',alignItems:'center',marginBottom:10}},
        h('span',{style:{fontSize:16,color,marginRight:10}},'📊'),
        h('div',{},
          h('span',{style:{fontSize:16,fontWeight:'bold',color:'var(--ink)',display:'block'}},nodeData.label||nodeData.name||''),
          h('span',{style:{fontSize:10,color:'var(--muted)'}},nodeData.domain+'.'+nodeData.table)
        )
      ),
      h('div',{className:'domain-box',style:{marginBottom:10}},
        h('div',{},'Type: ',h('span',{style:{color:'var(--brand)',fontSize:12}},nodeData.type||'Unknown')),
        nodeData.pk&&h('div',{style:{color:'var(--m-gold)',fontSize:11,marginTop:4}},'🔑 Primary Key'),
        nodeData.fk&&h('div',{style:{color:'var(--danger)',fontSize:11,marginTop:4}},'🔗 FK → '+nodeData.fk)
      ),
      nodeData.desc&&h('p',{style:{color:'var(--ink)',fontSize:12,lineHeight:1.6}},nodeData.desc)
    );
  }
  return null;
}

// ── GitHub repo browser ───────────────────────────────────
const REPO_LS_KEY='model_viewer:last_repo';
const CACHE_PREFIX='model_viewer:cache:';
const MODEL_DIR_RE=/^(ecm|mvm)(_v?\d+)?$/i;
// Default repo shown in the From Repo dialog when no saved repo exists.
// Change this single constant if you fork this viewer for a different project.
const DEFAULT_REPO='databricks-industry-solutions/lakehouse-industry-data-models';
const DEFAULT_BRANCH='main';

function parseRepoSpec(raw){
  if(!raw)return null;
  let s=String(raw).trim().replace(/\.git$/,'').replace(/\/+$/,'');
  let m=s.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+?)(?:\/tree\/([^\/\s]+)(?:\/(.*))?)?$/i);
  if(m)return {owner:m[1],repo:m[2],branch:m[3]||null,path:m[4]||''};
  m=s.match(/^git@github\.com:([^\/\s]+)\/(.+)$/i);
  if(m)return {owner:m[1],repo:m[2].replace(/\/+$/,''),branch:null,path:''};
  m=s.match(/^([^\/\s]+)\/([^\/\s]+)$/);
  if(m)return {owner:m[1],repo:m[2],branch:null,path:''};
  return null;
}

async function ghFetch(url,token,accept){
  const headers={'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(url,{headers});
  if(!r.ok){
    let body='';try{body=await r.text();}catch(_){}
    let msg=`GitHub API ${r.status}`;
    try{const j=JSON.parse(body);if(j&&j.message)msg+=`: ${j.message}`;}catch(_){msg+=': '+body.slice(0,200);}
    if(r.status===404)msg+=' (repo/branch/path not found, or token lacks access to a private repo)';
    if(r.status===401||r.status===403)msg+=' (auth or rate-limit; supply a token with repo scope)';
    const e=new Error(msg);e.status=r.status;throw e;
  }
  return r;
}
async function ghJson(url,token){return (await ghFetch(url,token)).json();}

async function fetchDefaultBranch(owner,repo,token){
  const info=await ghJson(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,token);
  return info.default_branch||'main';
}

async function fetchRepoTree(owner,repo,branch,token){
  // Resolve branch -> commit SHA -> tree SHA -> recursive tree
  const ref=await ghJson(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/ref/heads/${encodeURIComponent(branch)}`,token);
  const commitSha=ref&&ref.object&&ref.object.sha;
  if(!commitSha)throw new Error(`Branch '${branch}' not found`);
  const commit=await ghJson(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/commits/${commitSha}`,token);
  const treeSha=commit&&commit.tree&&commit.tree.sha;
  if(!treeSha)throw new Error('Could not resolve tree SHA from commit');
  return ghJson(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${treeSha}?recursive=1`,token);
}

async function fetchModelJsonRaw(owner,repo,branch,dirPath,token){
  const filePath=(dirPath?dirPath.replace(/^\/+|\/+$/g,'')+'/':'')+'model.json';
  const url=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${filePath.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(branch)}`;
  const r=await ghFetch(url,token,'application/vnd.github.raw');
  return r.text();
}

function cacheKey(owner,repo,branch,dirPath){return `${CACHE_PREFIX}${owner}/${repo}@${branch}:${dirPath||''}`;}
function readCachedModel(owner,repo,branch,dirPath){
  try{
    const raw=localStorage.getItem(cacheKey(owner,repo,branch,dirPath));
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return parsed&&typeof parsed.content==='string'?parsed:null;
  }catch(_){return null;}
}
function writeCachedModel(owner,repo,branch,dirPath,content){
  const k=cacheKey(owner,repo,branch,dirPath);
  const v=JSON.stringify({ts:Date.now(),content});
  try{localStorage.setItem(k,v);return;}catch(_){}
  // Quota: evict oldest 25% of cache entries and retry
  try{
    const keys=Object.keys(localStorage).filter(x=>x.startsWith(CACHE_PREFIX));
    const aged=keys.map(x=>{
      let ts=0;try{ts=JSON.parse(localStorage.getItem(x)||'{}').ts||0;}catch(_){}
      return [x,ts];
    }).sort((a,b)=>a[1]-b[1]);
    const trim=Math.max(1,Math.floor(aged.length/4));
    aged.slice(0,trim).forEach(([x])=>localStorage.removeItem(x));
    localStorage.setItem(k,v);
  }catch(_){/* give up silently */}
}
// Bump when the default repo changes so returning users with a stale saved
// repo in localStorage are auto-reset to DEFAULT_REPO (the latest published
// models) instead of silently re-loading a previously-browsed repo.
const REPO_SCHEMA_VERSION=2;
function readLastRepo(){try{const raw=localStorage.getItem(REPO_LS_KEY);if(!raw)return null;const p=JSON.parse(raw);return (p&&p._sv===REPO_SCHEMA_VERSION)?p:null;}catch(_){return null;}}
function writeLastRepo(spec){try{localStorage.setItem(REPO_LS_KEY,JSON.stringify({...spec,_sv:REPO_SCHEMA_VERSION}));}catch(_){}}

// Scan flat git/trees output for every industry model.json blob and group by
// industry. Supports two on-disk layouts:
//   NEW: <industry>/v<N>/(ecm|mvm)/model.json  (version dir is parent, scope dir is child)
//   OLD: <industry>/(ecm|mvm)_v?<N>/model.json (scope+version combined in one dir)
// Grouping key is the industry directory path, so all versions of one industry
// share a row and same-named industries under different prefixes stay distinct.
// Returns sorted rows: [{industry, parentPath, ecm:[{ver,name,path}], mvm:[...]}],
// versions sorted newest-first per scope.
function buildIndustryRows(treeEntries){
  const byKey={};
  (treeEntries||[]).forEach(e=>{
    if(!e||e.type!=='blob')return;
    const p=e.path||'';
    if(!p.endsWith('/model.json'))return;
    const parts=p.split('/');
    if(parts.length<3)return; // need at least <industry>/<scope_dir>/model.json
    const scopeDir=parts[parts.length-2];
    let scope,ver,industry,industryPath,name;
    const sm=scopeDir.match(/^(ecm|mvm)$/i);
    const vm=parts.length>=4?parts[parts.length-3].match(/^v(\d+)$/i):null;
    if(sm&&vm){
      // NEW layout: bare ecm|mvm scope dir under a v<N> version dir.
      scope=sm[1].toLowerCase();
      ver=parseInt(vm[1],10);
      industry=parts[parts.length-4];
      industryPath=parts.slice(0,-3).join('/');
      name='v'+ver;
    }else{
      // OLD layout: scope and version combined in a single dir.
      const om=scopeDir.match(/^(ecm|mvm)_v?(\d+)$/i);
      if(!om)return;
      scope=om[1].toLowerCase();
      ver=parseInt(om[2],10);
      industry=parts[parts.length-3];
      industryPath=parts.slice(0,-2).join('/');
      name=scopeDir;
    }
    const dirPath=parts.slice(0,-1).join('/');
    if(!byKey[industryPath]){byKey[industryPath]={industry,parentPath:industryPath,ecm:[],mvm:[]};}
    byKey[industryPath][scope].push({ver,name,path:dirPath});
  });
  return Object.values(byKey).map(r=>({
    ...r,
    ecm:r.ecm.sort((a,b)=>b.ver-a.ver),
    mvm:r.mvm.sort((a,b)=>b.ver-a.ver),
  })).sort((a,b)=>a.industry.localeCompare(b.industry)||a.parentPath.localeCompare(b.parentPath));
}

// One industry+scope cell. Enforces "always use the latest version": the newest
// version (items are pre-sorted newest-first) is the PRIMARY button; older
// versions stay reachable behind a collapsed "history" toggle so the default
// action a user can take is always the latest published model.
function ScopeCell({scope,items,resolved,loadingPath,onSelect,cacheTick}){
  const [showHistory,setShowHistory]=useState(false);
  if(!items||!items.length)return h('span',{style:{color:'var(--line-strong)'}},'—');
  const latest=items[0];
  const older=items.slice(1);
  const verBtn=(item,primary)=>{
    const cached=resolved?!!readCachedModel(resolved.owner,resolved.repo,resolved.branch,item.path):false;
    const isLoading=loadingPath===item.path;
    const bg=isLoading?'var(--faint)':(scope==='ecm'?'var(--brand)':'var(--g-violet-line)');
    return h('button',{key:item.path,onClick:()=>onSelect(item.path),disabled:isLoading,
      title:`Load ${item.path}/model.json`,
      style:{padding:primary?'5px 12px':'3px 9px',background:bg,color:'var(--ink)',border:'none',borderRadius:4,
             fontSize:primary?12:10,fontWeight:primary?700:600,cursor:isLoading?'wait':'pointer',
             opacity:primary?1:0.7,display:'inline-flex',alignItems:'center',gap:5,marginRight:6,marginBottom:4}},
      isLoading?'Loading…':(primary?`Load ${item.name} (latest)`:`Load ${item.name}`),
      cached&&!isLoading&&h('span',{style:{fontSize:9,background:'var(--well)',
        padding:'1px 5px',borderRadius:6}},'✓'));
  };
  return h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center'}},
    verBtn(latest,true),
    older.length>0&&h('button',{key:'__hist',onClick:()=>setShowHistory(v=>!v),
      title:`${older.length} older version${older.length>1?'s':''}`,
      style:{padding:'3px 8px',background:'transparent',color:'var(--muted)',border:'1px solid var(--line)',
             borderRadius:4,fontSize:10,cursor:'pointer',marginRight:6,marginBottom:4,whiteSpace:'nowrap'}},
      `history (${older.length}) ${showHistory?'▴':'▾'}`),
    showHistory&&older.map(it=>verBtn(it,false)));
}

function IndustryTable({rows,onSelect,loadingPath,resolved,cacheTick}){
  if(!rows||!rows.length){
    return h('div',{style:{textAlign:'center',padding:40,color:'var(--muted)',fontSize:12}},
      h('div',{style:{fontSize:32,marginBottom:10}},'🤷'),
      'No industry models found. Looking for ',
      h('code',{style:{color:'var(--brand)'}},'<industry>/v*/ecm/model.json'),' or ',
      h('code',{style:{color:'var(--brand)'}},'<industry>/v*/mvm/model.json'),' (or legacy ',
      h('code',{style:{color:'var(--brand)'}},'<industry>/(ecm|mvm)_v*/model.json'),') anywhere in the repo.');
  }
  const thStyle={textAlign:'left',padding:'10px 14px',fontSize:11,color:'var(--muted)',
                 textTransform:'uppercase',letterSpacing:0.5,borderBottom:'1px solid var(--line)',
                 background:'var(--bg)',position:'sticky',top:0,zIndex:1};

  return h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:13}},
    h('thead',{},h('tr',{},
      h('th',{style:thStyle},'Industry'),

      h('th',{style:thStyle},'Load MVM'))),

      h('td',{style:tdStyle}, h(ScopeCell,{scope:'mvm',items:row.mvm,resolved,loadingPath,onSelect,cacheTick})))))
  );
}

function RepoBrowser({onLoadModel,onClose}){
  // Resolution order for the initial repo / branch:
  //   1. last_repo from localStorage (user's most recent pick)
  //   2. DEFAULT_REPO / DEFAULT_BRANCH constants (this viewer's baseline)
  const last=useMemo(()=>readLastRepo()||{},[]);
  const initialRepo=(last.owner&&last.repo)
    ? `https://github.com/${last.owner}/${last.repo}`
    : (DEFAULT_REPO?`https://github.com/${DEFAULT_REPO}`:'');
  const initialBranch=last.branch||(DEFAULT_REPO?DEFAULT_BRANCH:'');
  const [repoInput,setRepoInput]=useState(initialRepo);
  const [branchInput,setBranchInput]=useState(initialBranch);
  const [tokenInput,setTokenInput]=useState(last.token||'');
  const [showToken,setShowToken]=useState(false);
  const [rows,setRows]=useState(null);
  const [resolved,setResolved]=useState(null);
  const [truncated,setTruncated]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [loadingPath,setLoadingPath]=useState(null);
  const [cacheTick,setCacheTick]=useState(0); // bump to force re-render after cache writes

  const browseRepo=useCallback(async(overrideRepo)=>{
    setError(null);setRows(null);setLoading(true);setTruncated(false);setResolved(null);
    try{
      const raw=(typeof overrideRepo==='string')?overrideRepo:repoInput;
      const spec=parseRepoSpec(raw);
      if(!spec)throw new Error('Could not parse repo. Use https://github.com/owner/repo, owner/repo, or git@github.com:owner/repo');
      // A branch embedded in a pasted /tree/<branch> URL is the most explicit signal,
      // so honour it over a stale value left in the Branch box, and reflect it back.
      let branch=(spec.branch||'').trim()||(branchInput||'').trim();
      if(spec.branch&&spec.branch!==branchInput){setBranchInput(spec.branch);}
      if(!branch){branch=await fetchDefaultBranch(spec.owner,spec.repo,tokenInput||null);}
      const treeData=await fetchRepoTree(spec.owner,spec.repo,branch,tokenInput||null);
      const built=buildIndustryRows(treeData.tree||[]);
      setRows(built);
      setResolved({owner:spec.owner,repo:spec.repo,branch});
      setTruncated(!!treeData.truncated);
      writeLastRepo({owner:spec.owner,repo:spec.repo,branch,token:tokenInput||''});
    }catch(e){setError(e.message||String(e));}
    finally{setLoading(false);}
  },[repoInput,branchInput,tokenInput]);

  // Auto-load on first open if we have either a saved repo OR a default.
  const autoRanRef=useRef(false);
  useEffect(()=>{
    if(autoRanRef.current)return;
    autoRanRef.current=true;
    if((last.owner&&last.repo)||DEFAULT_REPO){browseRepo();}
  },[]); // eslint-disable-line

  // Reset back to this viewer's default repo. Clears any stale saved repo in
  // localStorage (a common reason a previously-browsed repo hides newly
  // published versions) and re-browses the default so the latest is shown.
  const resetToDefault=useCallback(()=>{
    try{localStorage.removeItem(REPO_LS_KEY);}catch(_){}
    const durl=DEFAULT_REPO?`https://github.com/${DEFAULT_REPO}`:'';
    setRepoInput(durl);setBranchInput(DEFAULT_REPO?DEFAULT_BRANCH:'');setTokenInput('');
    if(durl)browseRepo(durl);
  },[browseRepo]);

  const handleSelect=useCallback(async(dirPath)=>{
    if(!resolved)return;
    setLoadingPath(dirPath);setError(null);
    try{
      const cached=readCachedModel(resolved.owner,resolved.repo,resolved.branch,dirPath);
      let content,fromCache=false;
      if(cached){content=cached.content;fromCache=true;}
      else{
        content=await fetchModelJsonRaw(resolved.owner,resolved.repo,resolved.branch,dirPath,tokenInput||null);
        writeCachedModel(resolved.owner,resolved.repo,resolved.branch,dirPath,content);
      }
      const data=JSON.parse(content);
      const label=`${resolved.owner}/${resolved.repo}@${resolved.branch}/${dirPath}/model.json${fromCache?' (cached)':''}`;
      onLoadModel(data,label);
      onClose();
    }catch(e){setError((e&&e.message)||String(e));}
    finally{setLoadingPath(null);setCacheTick(t=>t+1);}
  },[resolved,tokenInput,onLoadModel,onClose]);

  const clearCache=useCallback(()=>{
    if(!resolved){
      Object.keys(localStorage).filter(k=>k.startsWith(CACHE_PREFIX)).forEach(k=>localStorage.removeItem(k));
    }else{
      const pref=`${CACHE_PREFIX}${resolved.owner}/${resolved.repo}@${resolved.branch}:`;
      Object.keys(localStorage).filter(k=>k.startsWith(pref)).forEach(k=>localStorage.removeItem(k));
    }
    setCacheTick(t=>t+1);
  },[resolved]);

  const inputStyle={background:'var(--bg)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:4,padding:'8px 10px',fontSize:12,outline:'none',width:'100%'};
  const labelStyle={display:'block',color:'var(--muted)',fontSize:10,marginBottom:4,letterSpacing:0.5,textTransform:'uppercase'};

  return h('div',{style:{position:'fixed',inset:0,background:'var(--scrim)',
                          display:'flex',alignItems:'center',justifyContent:'center',zIndex:5000},
                  onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{style:{width:'min(720px, 92vw)',height:'min(720px, 88vh)',background:'var(--card)',
                    borderRadius:10,border:'1px solid var(--line)',boxShadow:'var(--shadow-xl)',
                    display:'flex',flexDirection:'column',overflow:'hidden'}},
      // Header
      h('div',{style:{padding:'14px 18px',borderBottom:'1px solid var(--line)',
                       display:'flex',alignItems:'center',gap:10,flexShrink:0}},
        h('span',{style:{fontSize:18}},'📁'),
        h('h2',{style:{margin:0,fontSize:15,fontWeight:600,flex:1,color:'var(--ink)'}},'Load model.json from GitHub repo'),
        h('button',{onClick:onClose,style:{background:'transparent',color:'var(--muted)',border:'none',
          fontSize:20,cursor:'pointer',padding:'0 6px',lineHeight:1}},'×')
      ),
      // Form
      h('div',{style:{padding:'14px 18px',borderBottom:'1px solid var(--well)',flexShrink:0}},
        h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10,marginBottom:8}},
          h('div',{},
            h('label',{style:labelStyle},'Repository'),
            h('input',{type:'text',value:repoInput,onChange:e=>{const v=e.target.value;setRepoInput(v);const sp=parseRepoSpec(v);if(sp&&sp.branch)setBranchInput(sp.branch);},
              placeholder:'https://github.com/owner/repo  or  owner/repo',
              style:inputStyle,
              onKeyDown:e=>{if(e.key==='Enter')browseRepo();}})
          ),
          h('div',{},
            h('label',{style:labelStyle},'Branch (blank = default)'),
            h('input',{type:'text',value:branchInput,onChange:e=>setBranchInput(e.target.value),
              placeholder:'main',style:inputStyle,
              onKeyDown:e=>{if(e.key==='Enter')browseRepo();}})
          )
        ),
        h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:8}},
          h('div',{style:{flex:1}},
            h('label',{style:labelStyle},'GitHub Token (optional, needed for private repos / rate limit)'),
            h('input',{type:showToken?'text':'password',value:tokenInput,onChange:e=>setTokenInput(e.target.value),
              placeholder:'ghp_… (stored in your browser localStorage)',style:inputStyle,
              onKeyDown:e=>{if(e.key==='Enter')browseRepo();}})
          ),
          h('div',{style:{display:'flex',flexDirection:'column',gap:4,paddingTop:14}},
            h('button',{onClick:()=>setShowToken(s=>!s),
              style:{padding:'6px 10px',background:'var(--line)',color:'var(--ink)',border:'1px solid var(--line)',
                     borderRadius:4,fontSize:10,cursor:'pointer',whiteSpace:'nowrap'}},
              showToken?'Hide':'Show')
          )
        ),
        h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
          h('button',{onClick:()=>browseRepo(),disabled:loading,
            style:{padding:'8px 16px',background:loading?'var(--line-strong)':'var(--brand)',color:'var(--ink)',border:'none',
                   borderRadius:4,fontSize:12,cursor:loading?'wait':'pointer',fontWeight:600}},
            loading?'Loading…':(rows?'Refresh':'Browse repo')),
          rows&&h('button',{onClick:clearCache,title:'Clear cached model.json files for this repo',
            style:{padding:'6px 10px',background:'var(--line)',color:'var(--ink)',border:'1px solid var(--line)',
                   borderRadius:4,fontSize:10,cursor:'pointer',whiteSpace:'nowrap'}},
            'Clear cache'),
          DEFAULT_REPO&&h('button',{onClick:resetToDefault,disabled:loading,
            title:`Reset to the default repository (${DEFAULT_REPO}) and show the latest published models`,
            style:{padding:'6px 10px',background:'var(--line)',color:'var(--ink)',border:'1px solid var(--line)',

const JSDELIVR_MAX_BYTES=20*1024*1024;   // jsDelivr refuses to serve above this
const FLAVOURS=[{id:'ecm',label:'ECM',title:'Enterprise Canonical Model — the full model'},
                {id:'mvm',label:'MVM',title:'Minimum Viable Model — the core subset'}];

function fmtBytes(n){
  if(!n&&n!==0) return '';
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(n<10485760?1:0)+' MB';
}
function fmtCount(n){
  if(n==null) return '—';
  return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(n);
}

function findIndustry(manifest,slug){
  return (manifest.industries||[]).find(i=>i.slug===slug)||null;
}
function findEntry(industry,version,flavour){
  if(!industry) return null;
  const v=(industry.versions||[]).find(x=>x.version===version)
        ||(industry.versions||[]).find(x=>x.version===industry.latest);
  if(!v) return null;
  const f=(v.flavours||[]).find(x=>x.flavour===flavour)||(v.flavours||[])[0];
  return f?{...f,version:v.version}:null;
}

/* Both URLs are pinned to the manifest's commit, so a model can never be
   fetched from a tree that disagrees with the counts the card advertised. */
function modelUrls(source,path,bytes){
  const {owner,repo,ref}=source;
  const raw=`https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path}`;
  if(bytes>JSDELIVR_MAX_BYTES) return [raw];
  return [`https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${path}`,raw];
}

/* Progress is measured in DECODED bytes, which is what the stream yields, so
   the manifest's uncompressed blob size is the right denominator even though
   the transfer itself is gzipped. */
async function fetchModelJson(urls,expectedBytes,onProgress){
  let lastErr=null;
  for(const url of urls){
    try{
      const res=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      if(!res.body||typeof res.body.getReader!=='function'){
        onProgress&&onProgress(expectedBytes,expectedBytes);
        return await res.json();
      }
      const reader=res.body.getReader(), chunks=[];
      let received=0;
      for(;;){
        const {done,value}=await reader.read();
        if(done) break;
        chunks.push(value); received+=value.length;
        onProgress&&onProgress(received,expectedBytes);
      }
      const buf=new Uint8Array(received);
      let at=0;
      for(const c of chunks){buf.set(c,at);at+=c.length;}
      return JSON.parse(new TextDecoder('utf-8').decode(buf));
    }catch(e){ lastErr=e; }
  }
  throw new Error((lastErr&&lastErr.message)||'all sources failed');
}
